
name: Lab 10-11 - API and Docker CI

on:
  push:
    branches: [main, master]
    paths:
      - "api/**"
      - "deployment/**"
      - "k8s/**"
      - "tests/test_api.py"
      - "tests/test_local_vs_container.py"
      - "tests/test_performance.py"
      - "Dockerfile"
      - ".dockerignore"
      - "requirements-api.txt"
      - ".github/workflows/lab10_lab11_ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "api/**"
      - "deployment/**"
      - "k8s/**"
      - "tests/test_api.py"
      - "tests/test_local_vs_container.py"
      - "tests/test_performance.py"
      - "Dockerfile"
      - ".dockerignore"
      - "requirements-api.txt"
      - ".github/workflows/lab10_lab11_ci.yml"
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-api.txt
          python -m pip install pytest httpx

      - name: Run API tests
        run: python -m pytest tests/test_api.py tests/test_local_vs_container.py tests/test_performance.py -v

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab10-lab11-test-results
          path: reports/lab10_performance_results.txt
          if-no-files-found: ignore

  docker-build:
    runs-on: ubuntu-latest
    needs: api-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t churn-prediction-api:lab11 .
